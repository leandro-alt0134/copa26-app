<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Copa 2026 - Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061A12" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #061A12;
        color: #F8FAFC;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        padding: 32px 24px;
        border-radius: 24px;
        background: rgba(8, 41, 29, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
        color: #00C853;
      }
      p {
        color: #B7C9C0;
        line-height: 1.5;
        font-size: 1.05rem;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #061A12;
        background: #FFD166;
        padding: 12px 24px;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 800;
        box-shadow: 0 4px 12px rgba(255, 209, 102, 0.35);
        transition: transform 0.2s;
      }
      a:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você está offline ⚽</h1>
      <p>Os palpites salvos continuam disponíveis neste dispositivo.</p>
      <p>Tente novamente quando a conexão voltar.</p>
      <a href="/">Recarregar App</a>
    </div>
  </body>
</html>
